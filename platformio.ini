; cono - firmware de oficina. `pio run -e cono -t upload -t monitor`
;
; Mismo esquema que Dou: un environment por firmware/modulo, para poder
; calibrar cada sensor/actuador por separado antes de correr todo junto.
; Los tests viven en /tests (no en /src), asi que cada env de test pisa
; src_dir para apuntar ahi.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/RTClib @ ^2.1.4          ; DS3231
	dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; --- firmware completo ---
[env:cono]
build_src_filter = +<main.cpp>

; --- tests por modulo, en /tests (troubleshooting con el circuito armado) ---
[env:mpu]
src_dir = tests
build_src_filter = +<t_mpu.cpp>

[env:sr04]
src_dir = tests
build_src_filter = +<t_sr04.cpp>

[env:boton]
src_dir = tests
build_src_filter = +<t_boton.cpp>

[env:mic]
src_dir = tests
build_src_filter = +<t_mic.cpp>

[env:rtc]
src_dir = tests
build_src_filter = +<t_rtc.cpp>

[env:dfplayer]
src_dir = tests
build_src_filter = +<t_dfplayer.cpp>

[env:display]
src_dir = tests
build_src_filter = +<t_display.cpp>
